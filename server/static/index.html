<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EgoLink W2 Remote Collect</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.topbar{display:flex;align-items:center;padding:10px 20px;background:linear-gradient(90deg,#16181d,#1a1d24);border-bottom:1px solid #2a2d35}
.topbar .logo{font-size:18px;font-weight:700;color:#f0a500}.topbar .logo span{color:#4fc3f7}
.topbar .wtag{font-size:10px;padding:2px 8px;border-radius:4px;background:#f0a500;color:#000;font-weight:700;margin-left:8px}
.topbar select{margin-left:auto;background:#1e2128;border:1px solid #2d3139;color:#e0e0e0;padding:6px 12px;border-radius:6px;font-size:13px}
.rt-btn{margin-left:12px;padding:7px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:.5px}
.rt-btn.on{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 0 14px rgba(34,197,94,.35)}
.rt-btn.off{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 0 14px rgba(239,68,68,.35)}
.rt-btn:hover{transform:scale(1.06);filter:brightness(1.1)}
.rt-btn:active{transform:scale(.97)}
.topbar .sb{display:flex;align-items:center;gap:6px;font-size:13px;margin-left:16px}
.sd{width:8px;height:8px;border-radius:50%;background:#555;transition:background .3s}.sd.on{background:#22c55e;box-shadow:0 0 6px #22c55e88}.sd.off{background:#ef4444}
.container{max-width:1100px;margin:0 auto;padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.cd{background:#181b22;border:1px solid #2a2d35;border-radius:12px;overflow:hidden}.cd:hover{border-color:#3a3d45}
.ch{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #2a2d35;font-size:14px;font-weight:600}
.ch .ic{margin-right:8px}.ch .mt{margin-left:auto;font-size:11px;color:#666;font-weight:400}
.cb{padding:16px}
.ax{text-align:center}.ax .al{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.ax .av{font-size:32px;font-weight:700;font-family:"SF Mono",Monaco,monospace;transition:color .3s,transform .15s;display:inline-block}.ax .au{font-size:12px;color:#666;margin-top:2px}
.axx .av{color:#42a5f5}.axy .av{color:#66bb6a}.axz .av{color:#ffa726}
.rr{display:flex;gap:16px;font-family:"SF Mono",Monaco,monospace;font-size:13px;color:#999;padding:8px 0;border-bottom:1px solid #1e2128}
.rr:last-child{border-bottom:none}.rr .lb{color:#666;width:60px}
.cs{text-align:center;padding:20px 16px}
.bc{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 15px rgba(59,130,246,.3);transition:all .2s}
.bc:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.4)}.bc:disabled{opacity:.5;cursor:not-allowed}
.tl{display:flex;align-items:center;justify-content:center;padding:16px 0;font-size:12px}
.ts{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
.td{width:14px;height:14px;border-radius:50%;border:2px solid #3a3d45;background:#181b22;transition:all .3s}
.ts.a .td{border-color:#3b82f6;background:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,.5);animation:pl 1.5s infinite}
.ts.d .td{border-color:#22c55e;background:#22c55e}.ts.f .td{border-color:#ef4444;background:#ef4444}
.tlb{color:#666;white-space:nowrap;font-size:11px}.ts.a .tlb{color:#3b82f6;font-weight:600}.ts.d .tlb{color:#22c55e}.ts.f .tlb{color:#ef4444}
.tc{flex:1;height:2px;background:#2a2d35;min-width:14px;max-width:40px}.tc.d{background:#22c55e}
@keyframes pl{0%,100%{box-shadow:0 0 5px rgba(59,130,246,.3)}50%{box-shadow:0 0 15px rgba(59,130,246,.6)}}
.ct{text-align:center;font-size:13px;color:#888;padding:4px 0 12px;font-family:"SF Mono",Monaco,monospace}
.ce{text-align:center;font-size:12px;color:#ef4444;padding:4px 0}
.cr{text-align:center;font-size:12px;color:#22c55e;padding:4px 0;font-family:"SF Mono",Monaco,monospace}
.cl{max-height:280px;overflow-y:auto}
.ci{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1e2128;font-size:12px}.ci:last-child{border-bottom:none}
.csb{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;min-width:52px;text-align:center}
.bp{background:#1e3a5f;color:#60a5fa}.br{background:#1e3a2f;color:#34d399}.bo{background:#1a3d1a;color:#4ade80}.bt{background:#3b1a1a;color:#f87171}
.cid{font-family:"SF Mono",Monaco,monospace;color:#888;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctm{color:#555;margin-left:auto;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 12px;text-align:left;font-weight:600;color:#888;background:#14161b;border-bottom:1px solid #2a2d35;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid #1a1d24;font-family:"SF Mono",Monaco,monospace;font-size:12px;color:#ccc}
tr:hover td{background:#1a1d24}
.bok{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:#1a3d1a;color:#4ade80}
.bcl{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:#1e3a5f;color:#60a5fa}
.em{text-align:center;padding:40px 16px;color:#555;font-size:14px}
.chart-box{width:100%;height:320px}
.three-box{width:100%;height:320px;position:relative}
.three-label{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#666;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">Ego<span>Link</span></div><span class="wtag">WEEK 2</span>
<select id="deviceSelect" onchange="fetchData();fetchCmdHistory()"><option value="">全部设备</option><option value="g02-s20251040108-esp32s3eye">g02-s20251040108-esp32s3eye</option></select>
<button id="rtBtn" class="rt-btn on" onclick="toggleAutoRefresh()">⏸️ 暂停实时更新</button>
<div class="sb"><span class="sd" id="statusDot"></span><span id="statusText" style="color:#888">等待连接...</span></div>
</div>
<div class="container">
<div class="g2">
<div class="cd"><div class="ch"><span class="ic">📡</span>远程采集控制<span class="mt">Week 2</span></div>
<div class="cs"><button class="bc" id="btnCollect" onclick="collectOnce()">🎯 采集一次最新数据</button><div style="font-size:11px;color:#555;text-align:right;padding:4px 0;margin-top:12px" id="lastUpdate"></div></div></div>
<div class="cd" id="cmdCard" style="display:none"><div class="ch"><span class="ic">📋</span><span id="cmdTitle">远程采集状态</span><span class="mt" id="cmdReqId"></span></div>
<div class="cb"><div class="tl">
<div class="ts a" id="s1"><div class="td"></div><span class="tlb">已提交</span></div>
<div class="tc" id="c1"></div>
<div class="ts" id="s2"><div class="td"></div><span class="tlb">设备接收</span></div>
<div class="tc" id="c2"></div>
<div class="ts" id="s3"><div class="td"></div><span class="tlb">完成</span></div>
<div class="tc" id="c3"></div>
<div class="ts" id="s4"><div class="td"></div><span class="tlb">超时</span></div>
</div><div class="ct" id="cmdTimer"></div><div class="ce" id="cmdError"></div><div class="cr" id="cmdResult"></div></div></div>
</div>
<div class="g3">
<div class="cd ax axx"><div class="cb"><div class="al">Axis X</div><div class="av" id="valX">--</div><div class="au">g</div></div></div>
<div class="cd ax axy"><div class="cb"><div class="al">Axis Y</div><div class="av" id="valY">--</div><div class="au">g</div></div></div>
<div class="cd ax axz"><div class="cb"><div class="al">Axis Z</div><div class="av" id="valZ">--</div><div class="au">g</div></div></div>
</div>
<!-- 三轴实时折线图 + 3D 姿态展示 -->
<div class="g2">
<div class="cd"><div class="ch"><span class="ic">📈</span>三轴加速度波形<span class="mt">滚动窗口 100 点</span></div>
<div class="cb"><div id="imuChart" class="chart-box"></div></div></div>
<div class="cd"><div class="ch"><span class="ic">🧊</span>3D 姿态实时展示<span class="mt">加速度计倾斜</span></div>
<div class="cb"><div id="imu3D" class="three-box"></div><div class="three-label">基于加速度计的重力倾斜演示</div></div></div>
</div>
<div class="g2">
<div class="cd"><div class="ch"><span class="ic">🔢</span>原始值 (14-bit)</div><div class="cb">
<div class="rr"><span class="lb">Raw X</span><span id="rawX">--</span></div>
<div class="rr"><span class="lb">Raw Y</span><span id="rawY">--</span></div>
<div class="rr"><span class="lb">Raw Z</span><span id="rawZ">--</span></div>
</div></div>
<div class="cd"><div class="ch"><span class="ic">📜</span>采集任务历史<span class="mt" id="cmdHistCnt"></span></div>
<div class="cl" id="cmdHistList"><div class="em">暂无采集任务</div></div></div>
</div>
<div class="cd"><div class="ch"><span class="ic">📊</span>IMU 数据记录<span class="mt" id="dataCount"></span></div>

<!-- Week 3: 教学求助事件面板 -->
<div class="cd" style="margin-bottom:16px">
<div class="ch"><span class="ic">🆘</span>教学求助事件 (Week3)<span class="mt" id="heCount"></span>
<span style="margin-left:auto;font-size:10px;color:#888;font-weight:400">
⚠️ 本次运行无物理LED/蜂鸣器，本地反馈以串口日志为证据 | 物理反馈: <b style="color:#f0a500">待补验</b>
</span></div>
<div style="padding:8px 16px;background:#1a1d24;border-bottom:1px solid #2a2d35">
<button class="bc" style="padding:8px 20px;font-size:13px" onclick="fetchHelpEvents()">🔄 刷新事件</button>
<button class="bc" style="padding:8px 20px;font-size:13px;margin-left:8px;background:linear-gradient(135deg,#f0a500,#d97706)" onclick="createTestEvent()">🧪 创建模拟事件</button>
</div>
<div id="helpEventsList" style="padding:12px 16px"><div class="em">暂无求助事件</div></div>
</div>

<div style="max-height:400px;overflow-y:auto" id="tableBody"><div class="em">暂无数据，等待板端上传...</div></div></div>
</div>
<script>
var DEVICES=new Set();var _chart=null,_pollTimer=null,_autoRefresh=true;
var _tblBuilt=false;
var TB=document.getElementById('tableBody');
var SD=document.getElementById('statusDot');
var ST=document.getElementById('statusText');
var LU=document.getElementById('lastUpdate');
var _failCount=0,FAIL_THRESHOLD=3,_serverOffsetMs=0;
var CT=document.getElementById('cmdTimer');
var BTN=document.getElementById('btnCollect');
var CMD_CARD=document.getElementById('cmdCard');
function sid(s){return s?s.substring(0,8)+'\u2026':s||''}
function fmtT(s){if(!s)return'--';var d=new Date(s);return isNaN(d)?s:d.toLocaleTimeString('zh-CN',{hour12:false})}
function us(id,cls){var el=document.getElementById(id);el.classList.remove('a','d','f');el.classList.add(cls)}
function uc(id,ok){var el=document.getElementById(id);el.classList.remove('d','dof');el.classList.add(ok?'d':'dof')}
async function syncServerTime(){try{var t0=Date.now();var r=await fetch('/api/server_time');var t1=Date.now();if(r.ok){var b=await r.json();if(b.server_time){var rtt=t1-t0;_serverOffsetMs=b.server_time*1000+(rtt/2)-(t0+t1)/2;console.log('ServerTime offset='+_serverOffsetMs.toFixed(0)+'ms RTT='+rtt+'ms')}}}catch(e){}}
function serverNowMs(){return Date.now()+_serverOffsetMs}
async function fetchData(){try{
var dev=document.getElementById('deviceSelect').value;
var u=dev?'/api/data?device_id='+encodeURIComponent(dev)+'&limit=20':'/api/data?limit=20';
var resp=await fetch(u);if(!resp.ok)throw new Error('HTTP '+resp.status);
var b=await resp.json();if(b.code!==0)throw new Error('API error');
var recs=b.data||[];
if(recs.length>0){var latest=recs[0];
var latestMs=Date.parse(latest.ts_server);
var isRecent=!isNaN(latestMs)&&(serverNowMs()-latestMs)<10000;
if(isRecent){SD.className='sd on';ST.innerHTML='<strong>'+latest.device_id+'</strong>';
}else if(!sPollId){SD.className='sd off';ST.textContent='\u8bbe\u5907\u79bb\u7ebf\uff08\u65e0\u65b0\u6570\u636e\uff09';}
LU.textContent='\u66f4\u65b0: '+fmtT(latest.ts_server);
if(!sPollId){us('s1','d');us('s2','d');us('s3','d');us('s4','d');uc('c1',1);uc('c2',1);uc('c3',1);
document.getElementById('cmdTitle').textContent='\u2705 \u8bbe\u5907\u5728\u7ebf \u00b7 \u6570\u636e\u6301\u7eed\u91c7\u96c6\u4e2d';}
document.getElementById('valX').textContent=(latest.ax!=null?latest.ax:0).toFixed(4);
document.getElementById('valY').textContent=(latest.ay!=null?latest.ay:0).toFixed(4);
document.getElementById('valZ').textContent=(latest.az!=null?latest.az:0).toFixed(4);
document.getElementById('rawX').textContent=latest.raw_x!=null?latest.raw_x:'--';
document.getElementById('rawY').textContent=latest.raw_y!=null?latest.raw_y:'--';
document.getElementById('rawZ').textContent=latest.raw_z!=null?latest.raw_z:'--';
updateImuChart(latest.ax||0,latest.ay||0,latest.az||0);
updateImu3D(latest.ax||0,latest.ay||0,latest.az||0);
recs.forEach(function(x){if(x.device_id)DEVICES.add(x.device_id)});updDevSel();_failCount=0;
}else{if(!sPollId){SD.className='sd off';ST.textContent='\u6682\u65e0\u6570\u636e';LU.textContent='';}
['valX','valY','valZ','rawX','rawY','rawZ'].forEach(function(i){document.getElementById(i).textContent='--'});_failCount=0;}
document.getElementById('dataCount').textContent=recs.length+' \u6761';
if(!recs.length){TB.innerHTML='<div class="em">\u6682\u65e0\u6570\u636e</div>';_tblBuilt=false;return}
if(!_tblBuilt){TB.innerHTML='<table><thead><tr><th>\u65f6\u95f4</th><th>\u8bbe\u5907</th><th>X(g)</th><th>Y(g)</th><th>Z(g)</th><th>\u7c7b\u578b</th><th>ID</th></tr></thead><tbody id="tRows"></tbody></table>';_tblBuilt=true;}
var tr=document.getElementById('tRows'),h='';
for(var i=0;i<recs.length;i++){var rc=recs[i];
var bd=rc.request_id?'<span class="bcl">\u8fdc\u7a0b\u91c7\u96c6</span>':'<span class="bok">\u5468\u671f</span>';
var tm=rc.ts_server?fmtT(rc.ts_server):'--';
h+='<tr><td>'+tm+'</td><td style="font-family:inherit">'+(rc.device_id||'')+'</td><td>'+(rc.ax!=null?rc.ax.toFixed(4):'--')+'</td><td>'+(rc.ay!=null?rc.ay.toFixed(4):'--')+'</td><td>'+(rc.az!=null?rc.az.toFixed(4):'--')+'</td><td>'+bd+'</td><td style="font-size:10px;color:#666">'+rc.id+'</td></tr>';}
tr.innerHTML=h;
}catch(e){_failCount++;console.error('fetchData('+_failCount+'/'+FAIL_THRESHOLD+'):',e);
if(_failCount>=FAIL_THRESHOLD){SD.className='sd off';ST.textContent='\u8fde\u63a5\u5931\u8d25('+_failCount+'\u6b21): '+e.message;}}}
async function fetchCmdHistory(){try{
const dev=document.getElementById('deviceSelect').value;
const u=dev?'/api/commands/history?device_id='+encodeURIComponent(dev)+'&limit=20':'/api/commands/history?limit=20';
const r=await fetch(u);if(!r.ok)return;const b=await r.json();const cmds=b.data||[];
document.getElementById('cmdHistCnt').textContent=cmds.length+' \u6761';
const el=document.getElementById('cmdHistList');
if(!cmds.length){el.innerHTML='<div class="em">\u6682\u65e0\u91c7\u96c6\u4efb\u52a1</div>';return}
let h='';const st={'pending':'\u5f85\u5904\u7406','received':'\u5df2\u63a5\u6536','completed':'\u5df2\u5b8c\u6210','timeout':'\u8d85\u65f6','failed':'\u5931\u8d25'};
const bc={'pending':'bp','received':'br','completed':'bo','timeout':'bt','failed':'bt'};
for(const c of cmds)h+='<div class="ci"><span class="csb '+(bc[c.status]||'bt')+'">'+(st[c.status]||c.status)+'</span><span class="cid" title="'+c.request_id+'">'+sid(c.request_id)+'</span><span class="ctm">'+fmtT(c.created_at)+'</span></div>';
el.innerHTML=h;}catch(e){console.error(e)}}
function updDevSel(){const sel=document.getElementById('deviceSelect'),cv=sel.value,ds=Array.from(DEVICES).sort();
sel.innerHTML='<option value="">\u5168\u90e8\u8bbe\u5907</option>';
ds.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;if(d===cv)o.selected=true;sel.appendChild(o)});}
var sRid=null,sPollId=null,sT0=null,sPollBusy=false,CMD_TIMEOUT_MS=70000;
async function collectOnce(){
var dev=document.getElementById('deviceSelect').value;
if(!dev){alert('\u8bf7\u5148\u9009\u62e9\u4e00\u4e2a\u8bbe\u5907');return}
BTN.disabled=true;BTN.textContent='\u23f3 \u4e0b\u53d1\u4e2d...';CMD_CARD.style.display='';
try{await syncServerTime();
var resp=await fetch('/api/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:dev,timeout_sec:60})});
var b=await resp.json();if(b.code!==0)throw new Error('\u521b\u5efa\u547d\u4ee4\u5931\u8d25');
sRid=b.data.request_id;sT0=Date.parse(b.data.created_at);us('s1','a');
CT.textContent='\u547d\u4ee4\u5df2\u4e0b\u53d1\uff0c\u7b49\u5f85\u8bbe\u5907\u54cd\u5e94...';
if(sPollId)clearInterval(sPollId);sPollBusy=false;sPollId=setInterval(pollStatus,1500);
}catch(e){BTN.disabled=false;BTN.textContent='\ud83d\udce1 \u91c7\u96c6\u4e00\u6b21\u6700\u65b0\u6570\u636e';
CT.textContent='\u274c '+e.message;us('s1','f');}}
async function pollStatus(){if(sPollBusy)return;sPollBusy=true;
try{var resp=await fetch('/api/commands/'+sRid);
if(!resp.ok){sPollBusy=false;return}
var b=await resp.json();var cmd=b.data;if(!cmd){sPollBusy=false;return}
var createdMs=Date.parse(cmd.created_at);
var nowMs=b.server_time?b.server_time*1000:serverNowMs();
var el=(nowMs-createdMs)/1000;if(el<0)el=0;
var elStr=el.toFixed(1),st=cmd.status;
if(st==='pending'){CT.textContent='\u7b49\u5f85\u8bbe\u5907\u8f6e\u8be2... '+elStr+'s / 60s'}
else if(st==='received'){us('s1','d');us('s2','a');CT.textContent='\u8bbe\u5907\u5df2\u63a5\u6536\uff0c\u6b63\u5728\u4e0a\u4f20\u6570\u636e... '+elStr+'s'}
else if(st==='completed'){us('s1','d');us('s2','d');us('s3','d');us('s4','d');uc('c1',1);uc('c2',1);uc('c3',1);
CT.textContent='\u2705 \u91c7\u96c6\u5b8c\u6210\uff01\u7528\u65f6 '+elStr+'s';
document.getElementById('cmdTitle').textContent='\u2705 \u8fdc\u7a0b\u91c7\u96c6\u6210\u529f';
clearInterval(sPollId);sPollId=null;BTN.disabled=false;BTN.textContent='\ud83d\udce1 \u91c7\u96c6\u4e00\u6b21\u6700\u65b0\u6570\u636e';fetchData();fetchCmdHistory();}
else if(st==='timeout'){us('s1','f');us('s2','f');CT.textContent='\u23f0 \u547d\u4ee4\u8d85\u65f6 ('+elStr+'s)';
document.getElementById('cmdTitle').textContent='\u23f0 \u547d\u4ee4\u8d85\u65f6';
clearInterval(sPollId);sPollId=null;BTN.disabled=false;BTN.textContent='\ud83d\udce1 \u91c7\u96c6\u4e00\u6b21\u6700\u65b0\u6570\u636e';fetchCmdHistory();}
else if(st==='failed'){us('s1','f');us('s2','f');CT.textContent='\u274c \u547d\u4ee4\u6267\u884c\u5931\u8d25 ('+elStr+'s)';
document.getElementById('cmdTitle').textContent='\u274c \u547d\u4ee4\u5931\u8d25';
clearInterval(sPollId);sPollId=null;BTN.disabled=false;BTN.textContent='\ud83d\udce1 \u91c7\u96c6\u4e00\u6b21\u6700\u65b0\u6570\u636e';fetchCmdHistory();}
if((nowMs-createdMs)>CMD_TIMEOUT_MS&&(st==='pending'||st==='received')){
us('s1','f');us('s2','f');CT.textContent='\u23f0 \u5ba2\u6237\u7aef\u8d85\u65f6 ('+elStr+'s)';
clearInterval(sPollId);sPollId=null;BTN.disabled=false;BTN.textContent='\ud83d\udce1 \u91c7\u96c6\u4e00\u6b21\u6700\u65b0\u6570\u636e';fetchCmdHistory();}
}catch(e){console.error('pollStatus error:',e)}sPollBusy=false;}
syncServerTime();fetchData();fetchCmdHistory();
function startPolling(){if(_pollTimer)clearInterval(_pollTimer);_pollTimer=setInterval(fetchData,500);}
function stopPolling(){if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}}
function toggleAutoRefresh(){_autoRefresh=!_autoRefresh;var btn=document.getElementById('rtBtn');if(_autoRefresh){btn.className='rt-btn on';btn.textContent='⏸️ 暂停实时更新';startPolling();}else{btn.className='rt-btn off';btn.textContent='▶️ 开始实时更新';stopPolling();}}
startPolling();

// ========== Week 3: 求助事件 ==========
var _heTestCounter = 100;
var HE_STYLES = {
  local_ack:'background:#3b82f620;color:#60a5fa;border:1px solid #3b82f640',
  uploading:'background:#8b5cf620;color:#a78bfa;border:1px solid #8b5cf640',
  delivered:'background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b40',
  acknowledged:'background:#22c55e20;color:#4ade80;border:1px solid #22c55e40',
  cancelled:'background:#ef444420;color:#f87171;border:1px solid #ef444440',
  failed:'background:#dc262620;color:#ef4444;border:1px solid #dc262640',
  timeout:'background:#6b728020;color:#9ca3af;border:1px solid #6b728040'
};
var HE_LABELS = {local_ack:'🔵 本地已确认',uploading:'🟣 上传中',delivered:'🟡 已送达',
  acknowledged:'🟢 已回应',cancelled:'🔴 已取消',failed:'❌ 上传失败',timeout:'⚫ 超时/未送达'};

async function fetchHelpEvents(){
  try{
    var dev=document.getElementById('deviceSelect').value;
    var u=dev?'/api/help_events?device_id='+encodeURIComponent(dev)+'&limit=20':'/api/help_events?limit=20';
    var resp=await fetch(u);if(!resp.ok)throw new Error('HTTP '+resp.status);
    var b=await resp.json();var evts=b.data||[];
    document.getElementById('heCount').textContent=evts.length+' 条';
    renderHelpEvents(evts);
  }catch(e){
    document.getElementById('helpEventsList').innerHTML='<div class="em">加载失败: '+e.message+'</div>';
  }
}

function renderHelpEvents(evts){
  var c=document.getElementById('helpEventsList');
  if(!evts.length){c.innerHTML='<div class="em">暂无求助事件</div>';return}
  var h='';
  evts.forEach(function(e){
    var isTest=e.source==='test';
    var noSr=!e.server_received_at;
    var st=e.status||'unknown';
    var style=HE_STYLES[st]||'background:#333;color:#ccc';
    h+='<div style="background:#1e2128;border:1px solid #2a2d35;border-radius:8px;padding:12px;margin-bottom:10px">';
    h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">';
    h+='<span style="font-family:monospace;font-size:12px;color:#4fc3f7">'+e.event_id+'</span>';
    h+=isTest?'<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:#f0a500;color:#000;font-weight:700">⚠️ 模拟 TEST</span>'
            :'<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:#22c55e;color:#fff;font-weight:700">真实按键</span>';
    h+='<span style="font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;'+style+'">'+(HE_LABELS[st]||st)+'</span>';
    h+='</div>';
    var fields=[['设备',e.device_id],['来源',e.source],['创建',e.created_at],['本地确认',e.local_ack_at],
      ['服务端接收',e.server_received_at],['查看者回应',e.viewer_ack_at],['取消时间',e.cancelled_at]];
    fields.forEach(function(f){
      var v=f[1];
      h+='<div style="display:flex;font-size:12px;padding:2px 0">';
      h+='<span style="color:#888;width:120px">'+f[0]+'</span>';
      h+=v?'<span style="color:#4ade80;font-family:monospace">'+v+'</span>'
           :'<span style="color:#ef4444;font-style:italic">— 空 —</span>';
      h+='</div>';
    });
    if(noSr&&st!=='cancelled'&&st!=='timeout'){
      h+='<div style="background:#2a0000;border:1px solid #ef4444;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#f87171">';
      h+='⚠️ <b>未送达/仅本地确认</b> — server_received_at 为空，不得显示"对方已收到"</div>';
    }
    var canAck=st==='delivered';
    var canCancel=['delivered','acknowledged','local_ack','uploading'].indexOf(st)>=0;
    h+='<div style="display:flex;gap:8px;margin-top:8px">';
    h+='<button onclick="heAck(\''+e.event_id+'\')" '+(canAck?'':'disabled')+' style="padding:4px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;'+(canAck?'':'opacity:.4;cursor:not-allowed')+'">👋 回应</button>';
    h+='<button onclick="heCancel(\''+e.event_id+'\')" '+(canCancel?'':'disabled')+' style="padding:4px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;'+(canCancel?'':'opacity:.4;cursor:not-allowed')+'">🚫 取消</button>';
    h+='</div></div>';
  });
  c.innerHTML=h;
}

async function heAck(eid){
  try{
    var resp=await fetch('/api/help_events/'+eid+'/ack',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({viewer_name:'web_viewer'})});
    var b=await resp.json();
    if(resp.status===409){alert('🔒 409 Conflict: '+b.detail);return}
    if(!resp.ok){alert('❌ 回应失败: '+(b.detail||resp.status));return}
    fetchHelpEvents();
  }catch(e){alert('❌ 请求失败: '+e.message)}
}

async function heCancel(eid){
  try{
    var resp=await fetch('/api/help_events/'+eid+'/cancel',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    var b=await resp.json();
    if(!resp.ok){alert('❌ 取消失败: '+(b.detail||resp.status));return}
    fetchHelpEvents();
  }catch(e){alert('❌ 请求失败: '+e.message)}
}

async function createTestEvent(){
  _heTestCounter++;
  var eid='SOS-test-'+_heTestCounter;
  try{
    var dev=document.getElementById('deviceSelect').value||'g02-s20251040108-esp32s3eye';
    var resp=await fetch('/api/help_events',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event_id:eid,device_id:dev,source:'test'})});
    var b=await resp.json();
    if(!resp.ok){alert('❌ 创建失败: '+(b.detail||resp.status));return}
    fetchHelpEvents();
  }catch(e){alert('❌ 请求失败: '+e.message)}
}

fetchHelpEvents();
setInterval(fetchHelpEvents,5000);

setInterval(fetchCmdHistory,5000);setInterval(syncServerTime,60000);

// ========== ECharts 三轴实时折线图 ==========
var CHART_MAX_POINTS = 100;
var _imuChart = null;
var _chartDataX = [], _chartDataY = [], _chartDataZ = [], _chartTimeLabels = [];

function initImuChart() {
  var dom = document.getElementById('imuChart');
  if (!dom || typeof echarts === 'undefined') return;
  _imuChart = echarts.init(dom, null, {renderer:'canvas'});
  var option = {
    backgroundColor: 'transparent',
    grid: {left:'8%',right:'4%',top:'12%',bottom:'14%'},
    tooltip: {trigger:'axis',backgroundColor:'#1e2128',borderColor:'#2a2d35',textStyle:{color:'#e0e0e0',fontSize:12}},
    legend: {data:['X (g)','Y (g)','Z (g)'],textStyle:{color:'#999',fontSize:11},top:4,right:10},
    xAxis: {type:'category',data:_chartTimeLabels,axisLabel:{color:'#666',fontSize:10,rotate:0,
      formatter:function(v){return v}},axisLine:{lineStyle:{color:'#2a2d35'}},splitLine:{show:false}},
    yAxis: {type:'value',name:'g',nameTextStyle:{color:'#666',fontSize:11},axisLabel:{color:'#666',fontSize:11},
      axisLine:{lineStyle:{color:'#2a2d35'}},splitLine:{lineStyle:{color:'#1e2128'}}},
    series: [
      {name:'X (g)',type:'line',data:_chartDataX,smooth:true,symbol:'none',lineStyle:{width:2,color:'#42a5f5'},itemStyle:{color:'#42a5f5'}},
      {name:'Y (g)',type:'line',data:_chartDataY,smooth:true,symbol:'none',lineStyle:{width:2,color:'#66bb6a'},itemStyle:{color:'#66bb6a'}},
      {name:'Z (g)',type:'line',data:_chartDataZ,smooth:true,symbol:'none',lineStyle:{width:2,color:'#ffa726'},itemStyle:{color:'#ffa726'}}
    ],
    animation: false
  };
  _imuChart.setOption(option);
  window.addEventListener('resize', function(){if(_imuChart)_imuChart.resize()});
}

function updateImuChart(ax, ay, az) {
  if (!_imuChart) return;
  var now = new Date();
  var label = ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);
  _chartTimeLabels.push(label);
  _chartDataX.push(parseFloat(ax.toFixed(4)));
  _chartDataY.push(parseFloat(ay.toFixed(4)));
  _chartDataZ.push(parseFloat(az.toFixed(4)));
  if (_chartTimeLabels.length > CHART_MAX_POINTS) {
    _chartTimeLabels.shift();
    _chartDataX.shift();
    _chartDataY.shift();
    _chartDataZ.shift();
  }
  _imuChart.setOption({
    xAxis: {data: _chartTimeLabels},
    series: [{data: _chartDataX},{data: _chartDataY},{data: _chartDataZ}]
  });
}

// ========== Three.js 3D 姿态展示 ==========
var _threeScene, _threeCamera, _threeRenderer, _threeBoard;
var _threeTargetRotX = 0, _threeTargetRotZ = 0;

function initImu3D() {
  var container = document.getElementById('imu3D');
  if (!container || typeof THREE === 'undefined') return;
  var w = container.clientWidth, h = container.clientHeight;

  _threeScene = new THREE.Scene();
  _threeCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  _threeCamera.position.set(0, 0, 5);

  _threeRenderer = new THREE.WebGLRenderer({alpha: true, antialias: true});
  _threeRenderer.setSize(w, h);
  _threeRenderer.setClearColor(0x000000, 0);
  container.appendChild(_threeRenderer.domElement);

  // 开发板长方体: 长2 宽1 高0.1
  var geo = new THREE.BoxGeometry(2, 1, 0.1);
  var mat = new THREE.MeshPhongMaterial({color: 0x1a73e8, transparent: true, opacity: 0.85, shininess: 80});
  _threeBoard = new THREE.Mesh(geo, mat);
  _threeScene.add(_threeBoard);

  // 线框叠加
  var wireGeo = new THREE.BoxGeometry(2, 1, 0.1);
  var wireMat = new THREE.MeshBasicMaterial({color: 0x4fc3f7, wireframe: true, transparent: true, opacity: 0.5});
  var wireMesh = new THREE.Mesh(wireGeo, wireMat);
  _threeBoard.add(wireMesh);

  // 坐标轴辅助线 (短小)
  var axesHelper = new THREE.AxesHelper(0.6);
  _threeBoard.add(axesHelper);

  // 灯光
  var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  _threeScene.add(ambientLight);
  var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(3, 4, 5);
  _threeScene.add(dirLight);
  var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dirLight2.position.set(-2, -1, 3);
  _threeScene.add(dirLight2);

  animateThree();
  window.addEventListener('resize', function(){
    if(!_threeRenderer) return;
    var w2 = container.clientWidth, h2 = container.clientHeight;
    _threeCamera.aspect = w2 / h2;
    _threeCamera.updateProjectionMatrix();
    _threeRenderer.setSize(w2, h2);
  });
}

function updateImu3D(ax, ay, az) {
  // Roll (绕Z轴): atan2(y, z)
  _threeTargetRotZ = Math.atan2(ay, az);
  // Pitch (绕X轴): atan2(-x, sqrt(y*y + z*z))
  _threeTargetRotX = Math.atan2(-ax, Math.sqrt(ay*ay + az*az));
}

function animateThree() {
  requestAnimationFrame(animateThree);
  if (!_threeBoard || !_threeRenderer || !_threeScene || !_threeCamera) return;
  // 平滑插值
  _threeBoard.rotation.x += (_threeTargetRotX - _threeBoard.rotation.x) * 0.12;
  _threeBoard.rotation.z += (_threeTargetRotZ - _threeBoard.rotation.z) * 0.12;
  _threeRenderer.render(_threeScene, _threeCamera);
}

// 初始化图表和3D
initImuChart();
initImu3D();
</script>
